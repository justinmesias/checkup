<title>CheckUP · Bubble Sheet Grader</title>
<style>
/* VOICE: a calm, quick classroom tool — the teacher's grading desk between classes.
   IDEA: an answer sheet under a red pen: bubbles, corner squares, checks and crosses.
   PICTURE: the working tool — the scanned slip with its marks checked, large.
   COLOUR and TYPE: paper white, graphite ink, red-pen accent, check green; Archivo + Atkinson Hyperlegible.
   LAYOUT: tab bar on top; one working column, cards of scanned slips, tables that stack on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#14161b);--paper:light-dark(#f6f6f3,#1c1f26);--ink:light-dark(#1b1f27,#eceef2);--mute:light-dark(#5b616e,#a3a9b5);
--line:light-dark(#dcdde0,#323743);--red:light-dark(#d1242f,#ff6b6b);--green:light-dark(#1a7f45,#4cc38a);--hi:light-dark(#ffe066,#7a6514);--blue:light-dark(#1f5fbf,#7aa7ff);
--field:light-dark(#ffffff,#22262e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,4vw,32px);font-weight:800}h3{font-size:18px;font-weight:600}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 24px Archivo,sans-serif;margin-right:auto}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--ink);font-style:normal;font-size:17px;position:relative}
.brand i::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--ink)}
.brand small{font:400 13px "Atkinson Hyperlegible",system-ui,sans-serif;opacity:.75}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav a{color:inherit;text-decoration:none;padding:10px 14px;border-radius:999px;font-weight:700;white-space:nowrap;min-height:44px;display:flex;align-items:center}
nav a[aria-current=page]{background:var(--bg);color:var(--ink)}
main{max-width:1100px;margin:auto;padding:22px max(4vw,14px) 60px}
.sync{font-size:13px;opacity:.75;width:100%;text-align:right;margin-top:-4px}.sync:empty{display:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.stackv>*+*{margin-top:16px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
input[type=text],input[type=number],select,textarea{font:16px "Atkinson Hyperlegible",sans-serif;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:180px;line-height:1.6}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{font:700 16px "Atkinson Hyperlegible",sans-serif;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{white-space:nowrap;font:700 16px "Atkinson Hyperlegible",system-ui,sans-serif;border:0;background:var(--bg);color:var(--ink);padding:9px 16px;min-height:44px;cursor:pointer}
.seg.wrap{flex-wrap:wrap;border-radius:18px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.5}
.muted{color:var(--mute)}.small{font-size:14px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--hi);color:#2b2300;margin:2px 4px 2px 0}
.chip.red{background:var(--red);color:#fff}.chip.ok{background:var(--green);color:#fff}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;background:var(--paper)}
.drop.over{border-color:var(--blue)}
.drop .row{justify-content:center}
.btn.big{justify-content:center;font-size:19px;padding:14px 28px;min-height:56px}
.banner{border-radius:14px;padding:16px;margin-bottom:14px;text-align:left}
.banner .score{font-size:42px}
.banner.good{background:light-dark(#e6f4ec,#163524);border:2px solid var(--green)}
.banner.bad{background:light-dark(#fdeaea,#3a1a1c);border:2px solid var(--red)}
.banner.busy{background:var(--field);border:2px dashed var(--line)}
.bline+.bline{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
@media(max-width:600px){.scanbar{position:sticky;bottom:10px;z-index:3;background:var(--paper);padding:8px;border-radius:16px;box-shadow:0 4px 18px #0003}.scanbar .big{flex:1 1 100%}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.scan{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start;cursor:pointer;text-align:left;font:inherit;color:inherit}
.strip{display:block;max-width:100%;border-radius:4px;border:1px solid var(--line);background:#fff;margin-top:2px}
.scan canvas{width:110px;border-radius:6px;border:1px solid var(--line);background:#fff}
.score{font:800 34px Archivo,sans-serif;line-height:1}
.score small{font-size:16px;font-weight:600;color:var(--mute)}
.who{font-weight:700}
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px}
.krow{display:flex;align-items:center;gap:6px}
.pts{width:auto;min-height:38px;padding:4px 6px;font-size:14px;margin-left:4px}
.krow b{width:28px;text-align:right;font-variant-numeric:tabular-nums}
.bub{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);color:var(--mute);font:700 15px "Atkinson Hyperlegible",system-ui,sans-serif;cursor:pointer;padding:0}
.bub[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.keystat{font-size:14px;font-weight:700;margin:4px 0 0}.keystat.done{color:var(--green)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.keyc{font-weight:800;color:var(--green)}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font:800 28px Archivo,sans-serif;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mute)}
.hist{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:18px;border-bottom:1.5px solid var(--ink)}
.hist div{flex:1;background:var(--ink);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.hist div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute)}
.hx{display:flex;gap:3px;font-size:12px;color:var(--mute)}.hx span{flex:1;text-align:center}
.empty{text-align:center;padding:36px 16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:left;margin:18px 0}
.steps div{border-top:3px solid var(--ink);padding-top:10px}
dialog{border:0;border-radius:16px;padding:0;max-width:min(980px,96vw);width:100%;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#0009}
.dlg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding:18px}
.dlg canvas{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;touch-action:manipulation;cursor:pointer}
.legend{font-size:13px;display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid;vertical-align:-1px;margin-right:4px}
.preview svg{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:90vw;transition:opacity .3s}
.hidden{display:none!important}
@media(max-width:700px){.dlg{grid-template-columns:1fr}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}.brand small{display:none}nav a{padding:10px 11px}}
#live{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column}
#live video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lvGuide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(82vw,calc(70vh * 0.77));max-height:70vh;border:3px dashed #ffffffb0;border-radius:12px;pointer-events:none}
.lvTop,.lvBottom{position:absolute;left:0;right:0;display:flex;gap:8px;align-items:center;padding:max(12px,env(safe-area-inset-top)) 14px 12px;flex-wrap:wrap}
.lvTop{top:0;justify-content:space-between}.lvBottom{bottom:0;flex-direction:column;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.lvPill{background:#000a;padding:8px 14px;border-radius:999px;font-weight:700;text-align:center}
.lvRes{background:#1a7f45;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;max-width:92vw}
.lvScore{font:800 34px Archivo,system-ui,sans-serif}.lvScore small{font-size:16px;opacity:.85}
#live .btn{background:#000a;color:#fff;border-color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="top"><div class="bar">
  <div class="brand"><i aria-hidden="true"></i><span id="appName">CheckUP</span> <small>bubble-sheet grader</small></div>
  <nav aria-label="Sections">
    <a href="#grade">Grade</a><a href="#assessments">Assessments</a><a href="#classes">Classes</a><a href="#results">Results</a>
  </nav>
  <div class="sync" id="sync"></div>
</div></header>
<main id="view"></main>
<dialog id="dlg"></dialog>
<div class="toast hidden" id="toast" role="status"></div>
<input type="file" id="fPhoto" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fFiles" accept="image/*,application/pdf" multiple class="hidden">
<input type="file" id="fKey" accept="image/*" class="hidden">
<input type="file" id="fKeyAny" accept="image/*,application/pdf,.pdf,.docx,.xlsx,.xls,.csv,.txt,text/plain" multiple class="hidden">
<input type="file" id="fRoster" accept="image/*,application/pdf,.pdf,.csv,.txt,.tsv,.xlsx,.xls,text/plain,text/csv" multiple class="hidden">
<input type="file" id="fImport" accept="application/json,.json" class="hidden">
<script src="engine.js"></script>
<script>
{
const OFFLINE = true;
const LIB = OFFLINE ? {
  pdf: 'libs/pdf.min.js', pdfw: 'libs/pdf.worker.min.js', jspdf: 'libs/jspdf.umd.min.js', xlsx: 'libs/xlsx.full.min.js', mammoth: 'libs/mammoth.browser.min.js'
} : {
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', pdfw: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js'
};
const $ = s => document.querySelector(s);
const E = Tsek.esc, LET = Tsek.LET;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const LS = 'tsek.v1';
let S = { classes: [], assessments: [] };
const SESSION = new Map(); // resultId -> {rect, prev}
const rectCanvas = new WeakMap();
let cur = { last: null, busy: false, sort: 'name', aid: null, edit: null, multi: false, paper: 'letter', pages: 1, rid: null };
let recent = []; // result ids scanned this session (for Grade view)

/* ---------- storage ---------- */
try { const raw = localStorage.getItem(LS); if (raw) S = JSON.parse(raw); } catch (e) {}
S.classes = S.classes || []; S.assessments = S.assessments || []; 
let DB = null, BASE = null, pending = new Set(), ftimer = null;
let stTimer = null;
function saveLocal() {
  S.savedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  if (OFFLINE) { clearTimeout(stTimer); stTimer = setTimeout(() => stPut(S), 300); }
}
let STDB = null;
function stOpen() { return STDB ? Promise.resolve(STDB) : new Promise(res => { try { const rq = indexedDB.open('checkup-data', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('kv'); rq.onsuccess = () => { STDB = rq.result; res(STDB); }; rq.onerror = () => res(null); } catch (e) { res(null); } }); }
async function stPut(v) { const db = await stOpen(); if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(v)), 'state'); } catch (e) {} }
async function stGet() { const db = await stOpen(); if (!db) return null; return new Promise(res => { try { const rq = db.transaction('kv').objectStore('kv').get('state'); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); } catch (e) { res(null); } }); }
if (OFFLINE) {
  stGet().then(v => { if (v && (v.savedAt || 0) > (S.savedAt || 0)) { S = v; S.classes = S.classes || []; S.assessments = S.assessments || []; render(); } else if (S.assessments.length || S.classes.length) stPut(S); });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(); }); });
    }).catch(() => {});
  }
}
function showUpdate() { const el = $('#toast'); el.innerHTML = 'A new version of CheckUP is ready. <button class="btn sm" id="upd" style="margin-left:8px">Reload</button>'; el.classList.remove('hidden'); $('#upd').onclick = () => location.reload(); }
function persist(kind, id) {
  saveLocal();
  if (!DB) return;
  pending.add(kind === 'classes' ? 'classes' : 'a-' + id);
  clearTimeout(ftimer); ftimer = setTimeout(flush, 700);
}
async function flush() {
  for (const k of [...pending]) {
    pending.delete(k);
    let body;
    if (k === 'classes') body = { list: S.classes, updated: Date.now() };
    else { const a = S.assessments.find(x => 'a-' + x.id === k); body = a ? a : { id: k.slice(2), deleted: true, updated: Date.now() }; }
    try { await DB.doc(BASE + '/' + k).set(JSON.parse(JSON.stringify(body))); setSync(''); }
    catch (e) { setSync(e && e.code === 'quota_exceeded' ? 'Account storage full: saved on this device only' : e && e.code === 'invalid_argument' ? 'Saved on this device only' : 'Saved on this device (sync paused)'); }
  }
}
function setSync(t) { $('#sync').textContent = t; }
(async () => {
  try {
    if (OFFLINE || !window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const snap = await Promise.race([db.collection('data/users/' + id).get(), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 10000))]);
    DB = db; BASE = 'data/users/' + id;
    const remoteA = new Map(); let remoteC = null;
    for (const d of snap.docs) { const v = JSON.parse(JSON.stringify(d.data() || {})); /* snapshots are frozen: copy before editing */ if (d.id === 'classes') remoteC = v; else if (d.id.startsWith('a-')) remoteA.set(v.id, v); }
    if (remoteC && (!S.classesUpdated || (remoteC.updated || 0) >= S.classesUpdated)) S.classes = remoteC.list || [];
    else if (S.classes.length) pending.add('classes');
    const local = new Map(S.assessments.map(a => [a.id, a]));
    const merged = [];
    for (const [k, r] of remoteA) { const l = local.get(k); if (l && (l.updated || 0) > (r.updated || 0)) { merged.push(l); pending.add('a-' + k); } else if (!r.deleted) merged.push(r); local.delete(k); }
    for (const [k, l] of local) { merged.push(l); pending.add('a-' + k); }
    S.assessments = merged.sort((a, b) => (b.created || 0) - (a.created || 0)); migrate();
    saveLocal(); setSync(''); render();
    if (pending.size) flush();
  } catch (e) { setSync(''); }
})();

/* ---------- photo previews (kept on this device only) ---------- */
const PH = { db: null, cache: new Map(), loading: new Set(), ok: true };
function phDB() {
  if (PH.db || !PH.ok) return Promise.resolve(PH.db);
  return new Promise(res => {
    try {
      const rq = indexedDB.open('checkup-photos', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('p');
      rq.onsuccess = () => { PH.db = rq.result; res(PH.db); };
      rq.onerror = () => { PH.ok = false; res(null); };
    } catch (e) { PH.ok = false; res(null); }
  });
}
async function phPut(id, blob) { const db = await phDB(); if (!db) return; try { db.transaction('p', 'readwrite').objectStore('p').put({ blob, at: Date.now() }, id); } catch (e) {} }
async function phDel(ids) { const db = await phDB(); ids.forEach(i => PH.cache.delete(i)); if (!db) return; try { const st = db.transaction('p', 'readwrite').objectStore('p'); ids.forEach(i => st.delete(i)); } catch (e) {} }
async function phGet(id) { const db = await phDB(); if (!db) return null; return new Promise(res => { try { const rq = db.transaction('p').objectStore('p').get(id); rq.onsuccess = () => res(rq.result ? rq.result.blob : null); rq.onerror = () => res(null); } catch (e) { res(null); } }); }
async function phStats() { const db = await phDB(); if (!db) return null; return new Promise(res => { let n = 0, b = 0; try { const rq = db.transaction('p').objectStore('p').openCursor(); rq.onsuccess = () => { const c = rq.result; if (c) { n++; b += c.value.blob.size; c.continue(); } else res({ n, b }); }; rq.onerror = () => res(null); } catch (e) { res(null); } }); }
async function phClear() { const db = await phDB(); PH.cache.clear(); if (db) try { db.transaction('p', 'readwrite').objectStore('p').clear(); } catch (e) {} }
function photoFor(r, done) {
  const sess = SESSION.get(r.id);
  if (sess && sess.rect) return rectToCanvas(sess.rect);
  if (PH.cache.has(r.id)) return PH.cache.get(r.id);
  if (!PH.loading.has(r.id)) {
    PH.loading.add(r.id);
    phGet(r.id).then(blob => { if (!blob) { PH.cache.set(r.id, null); done && done(); return; } const img = new Image(); img.onload = () => { PH.cache.set(r.id, img); done && done(); }; img.src = URL.createObjectURL(blob); });
  }
  return null;
}
function rectToCanvas(rect) {
  let src = rectCanvas.get(rect);
  if (!src) {
    src = document.createElement('canvas'); src.width = rect.w; src.height = rect.h;
    const id = src.getContext('2d').createImageData(rect.w, rect.h);
    for (let i = 0, j = 0; i < rect.g.length; i++, j += 4) { id.data[j] = id.data[j + 1] = id.data[j + 2] = rect.g[i]; id.data[j + 3] = 255; }
    src.getContext('2d').putImageData(id, 0, 0); rectCanvas.set(rect, src);
  }
  return src;
}
function savePhoto(rid, rect) { const c = rectToCanvas(rect); c.toBlob(b => b && phPut(rid, b), 'image/jpeg', 0.62); }

/* ---------- helpers ---------- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 2800); }
const A = id => S.assessments.find(a => a.id === id);
const C = id => S.classes.find(c => c.id === id);
const PART = new Set(['de', 'del', 'dela', 'della', 'delos', 'de los', 'de la', 'san', 'sta', 'sta.', 'santa', 'santo', 'sto', 'sto.', 'van', 'von', 'da', 'di', 'du', 'le', 'la', 'los', 'mac', 'mc']);
function surnameKey(name) {
  name = String(name || '').trim(); if (!name) return '';

let SAMPLE = null, sampleTried = false;
async function getSample() { if (OFFLINE) return null; if (!sampleTried) { sampleTried = true; try { SAMPLE = window.claude && claude.use ? await claude.use('sample') : null; } catch (e) { SAMPLE = null; } } return SAMPLE; }
const ROSTER_PROMPT = `You are reading a class list (class record, enrollment list, or attendance sheet) from a Philippine university.
List EVERY student's name, in the same order as the list.
- Write each as "Surname, Given names Middle-initial." in normal capitalization, e.g. "Dela Cruz, Juan P." (convert ALL CAPS to Title Case; keep particles like Dela, De los, San).
- Leave out headers, column titles, student numbers, programs/courses, sections, grades, signatures, and the teacher's name.
- Do not invent or guess names you cannot read; if a name is partly unreadable, give your best reading and add it to "unclear".
Reply with only JSON: {"names": ["Dela Cruz, Juan P.", "..."], "unclear": ["..."]}`;
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  const delim = (text.split('\n')[0].match(/\t/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? '\t' : ',';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true; else if (ch === delim) { row.push(cell.trim()); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
  return rows.filter(r => r.some(Boolean));
}
const titleCase = n => n === n.toUpperCase() ? n.toLowerCase().replace(/(^|[\s,.'-])([a-zñ])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(De|Del|Dela|Delos|De La|De Los|Y)\b(?=\s)/g, x => x) : n;
function heuristicNames(text) {
  const rows = parseCSV(String(text));
  const hi = rows.findIndex(r => r.some(c => /name/i.test(c)));
  if (hi >= 0) {
    const h = rows[hi].map(c => c.toLowerCase());
    const sur = h.findIndex(c => /(sur|last|family)\s*name|^surname$/.test(c)), first = h.findIndex(c => /(first|given)\s*name/.test(c)), mid = h.findIndex(c => /middle/.test(c));
    const full = h.findIndex(c => /name/.test(c) && !/(sur|last|family|first|given|middle)/.test(c));
    const out = [];
    for (const r of rows.slice(hi + 1)) {
      let nm = '';
      if (sur >= 0 && first >= 0) nm = r[sur] && (r[sur] + ', ' + (r[first] || '') + (mid >= 0 && r[mid] ? ' ' + r[mid][0] + '.' : '')).trim();
      else if (full >= 0) nm = r[full];
      nm = (nm || '').replace(/\s+/g, ' ').replace(/,\s*$/, '').trim();
      if (nm && /[A-Za-zÑñ]/.test(nm)) out.push(titleCase(nm));
    }
    if (out.length) return out;
  }
  const out = [];
  for (let line of String(text).split(/\r?\n/)) {
    line = line.replace(/\b\d{4}-?\d{5}\b/g, ' ').replace(/^\s*\d+[.)\-\s]+/, '').replace(/[",]+\s*$/, '').replace(/"/g, '').trim();
    if (!line || !/[A-Za-zÑñ]/.test(line) || /\b(name|student|class list|section|program|course)\b/i.test(line)) continue;
    if (line.length >= 3 && line.length <= 80) out.push(titleCase(line.replace(/\s+/g, ' ')));
  }
  return out;
}
async function fileText(f) {
  const name = f.name.toLowerCase();
  if (/\.(xlsx|xls)$/.test(name)) {
    if (!window.XLSX) await loadScript(LIB.xlsx);
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    return wb.SheetNames.map(n => XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n');
  }
  if (/\.docx$/.test(name)) {
    if (!window.mammoth) await loadScript(LIB.mammoth);
    return (await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() })).value;
  }
  return await f.text();
}
async function gatherFiles(files) {
  let text = '', images = [];
  for (const f of files) {
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {

    ${rows.some(x => !x.nm) && !OFFLINE ? `<div class="row"><button class="btn sm" id="rdNames">Read written names with Claude</button><span class="small muted">Types out the handwritten names so you can sort by surname. Uses a little of your Claude usage.</span></div>` : ''}</div>
    <div class="card"><h3>Item analysis</h3><p class="small muted">Difficulty p = share who got it right. Discrimination D = upper ${st.g} minus lower ${st.g} students (27% groups), divided by group size. Key in green.</p>
      <div class="scroll"><table><thead><tr><th class="n">Item</th><th>Key</th><th class="n">Pts</th><th class="n">p</th><th>Difficulty</th><th class="n">D</th><th>Discrimination</th>${LET.map(l => `<th class="n">${l}</th>`).join('')}<th class="n">Blank</th><th>Notes</th></tr></thead><tbody>
      ${st.items.map(it => `<tr><td class="n">${it.i + 1}</td><td class="keyc">${E(it.k) || '–'}</td><td class="n">${it.w}</td><td class="n">${fmt(it.p, 2)}</td><td>${pLabel(it.p)}</td><td class="n">${fmt(it.D, 2)}</td><td>${dLabel(it.D)}</td>${LET.map(l => `<td class="n" ${it.k.includes(l) ? 'style="font-weight:800;color:var(--green)"' : ''}>${it.cnt[l]}</td>`).join('')}<td class="n">${it.cnt.blank + it.cnt.multi}</td><td class="small">${it.notes.map(E).join('; ')}</td></tr>`).join('')}
      </tbody></table></div></div>`}
  </div>`;
  bindPicker();
  document.querySelectorAll('[data-open]').forEach(tr => tr.onclick = () => openReview(tr.dataset.open));
  fillStrips(a, Math.min(240, innerWidth - 150));
  const rn = $('#rdNames'); if (rn) rn.onclick = () => { let k = 0; for (const x of rows) if (!x.nm && !x.r.npend) { queueName(a, x.r); k++; } toast(k ? `Reading ${k} name${k > 1 ? 's' : ''}…` : 'Nothing to read'); render(); };
  document.querySelectorAll('[data-rsec]').forEach(b => b.onclick = () => { cur.rsec = b.dataset.rsec; render(); });
  document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { cur.sort = b.dataset.sort; render(); });
  if (!st.N) return;
  const base = Tsek.APP + '-' + slug(a.title) + (multi && cur.rsec !== 'all' ? '-' + slug(secName(cur.rsec)) : '');
  const sx = sec => multi ? [secName(sec)] : [], sh = multi ? ['Section'] : [];
  const tScores = () => [[...sh, 'Class no.', 'Name', 'Score', 'Out of', 'Percent'], ...rows.map(({ r, s, nm, sec }) => [...sx(sec), r.no ?? '', nm, s, P, P ? (100 * s / P).toFixed(1) : ''])];
  const tItems = () => [['Item', 'Key', 'Points', 'p', 'Difficulty', 'D', 'Discrimination', ...LET, 'Blank', 'Multiple', 'Notes'], ...st.items.map(it => [it.i + 1, it.k, it.w, fmt(it.p, 3), pLabel(it.p), fmt(it.D, 3), dLabel(it.D), ...LET.map(l => it.cnt[l]), it.cnt.blank, it.cnt.multi, it.notes.join('; ')]), [], ['Students', st.N], ['Mean', fmt(st.mean, 2)], ['SD', fmt(st.sd, 2)], [weighted(a) ? 'Reliability (alpha, weighted)' : 'KR-20', fmt(st.kr20, 3)]];
  const tResp = () => [[...sh, 'Class no.', 'Name', 'Score', ...a.key.map((_, i) => 'Q' + (i + 1))], [...sh.map(() => ''), 'KEY', '', '', ...a.key], [...sh.map(() => ''), 'POINTS', '', '', ...a.key.map((_, i) => ptsOf(a, i))], ...rows.map(({ r, s, nm, sec }) => [...sx(sec), r.no ?? '', nm, s, ...a.key.map((_, i) => r.answers[i] || '')])];
  $('#xScores').onclick = () => saveFile(base + '-scores.csv', toCSV(tScores()));
  $('#xItems').onclick = () => saveFile(base + '-item-analysis.csv', toCSV(tItems()));
  $('#xResp').onclick = () => saveFile(base + '-responses.csv', toCSV(tResp()));
  $('#gScores').onclick = () => copyTable(tScores(), 'Scores');
  $('#gItems').onclick = () => copyTable(tItems(), 'Item analysis');
  $('#gResp').onclick = () => copyTable(tResp(), 'Responses');
}

document.getElementById('appName').textContent = Tsek.APP; document.title = Tsek.APP + ' · Bubble Sheet Grader';
render();
}
</script>
</body>
</html>
